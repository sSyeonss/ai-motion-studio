<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Motion Studio</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 17 17 7M9 7h8v8"/></svg></span>AI Motion Studio</div>

    <nav class="tabs" role="tablist" aria-label="메뉴">
      <button class="tab active" data-tab="home" data-desc="다음에 할 일을 알려드려요">
        <svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>홈 · 작업 현황</span></button>
      <button class="tab" data-tab="plan" data-step="plan"><i class="step-no">1</i><span>기획</span><em class="nav-badge"></em></button>
      <button class="tab" data-tab="chars" data-step="chars"><i class="step-no">2</i><span>캐릭터 시트</span><em class="nav-badge"></em></button>
      <button class="tab" data-tab="style" data-step="style"><i class="step-no">3</i><span>스타일프레임</span><em class="nav-badge"></em></button>
      <button class="tab" data-tab="board" data-step="board"><i class="step-no">4</i><span>스토리보드</span><em class="nav-badge"></em></button>
      <button class="tab" data-tab="shots" data-step="shots"><i class="step-no">5</i><span>이미지화</span><em class="nav-badge"></em></button>
      <button class="tab" data-tab="select" data-step="select"><i class="step-no">6</i><span>애니메틱</span><em class="nav-badge"></em></button>
      <button class="tab" data-tab="video" data-step="video"><i class="step-no">7</i><span>영상화</span><em class="nav-badge"></em></button>
      <button class="tab" data-tab="edit" data-step="edit"><i class="step-no">8</i><span>편집 · AE</span><em class="nav-badge"></em></button>
    </nav>

    <div class="side-sec">
      <div class="side-label">최근 프로젝트 <button id="newProjectBtn" class="icon-btn side-add" type="button" title="새 프로젝트" aria-label="새 프로젝트">＋</button></div>
      <div id="projectList" class="project-list"></div>
      <div class="project-tools">
        <select id="projectSelect" aria-label="모든 프로젝트" title="모든 프로젝트"></select>
        <button id="exportBtn" class="icon-btn" title="백업 내보내기" aria-label="백업 내보내기">
          <svg viewBox="0 0 24 24"><path d="M12 3v12m0 0-4-4m4 4 4-4M5 21h14"/></svg></button>
        <button id="importBtn" class="icon-btn" title="백업 가져오기" aria-label="백업 가져오기">
          <svg viewBox="0 0 24 24"><path d="M12 15V3m0 0L8 7m4-4 4 4M5 21h14"/></svg></button>
        <button id="deleteProjectBtn" class="icon-btn danger" title="지금 프로젝트 삭제" aria-label="프로젝트 삭제">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6m4-6v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
      </div>
      <input id="importFile" type="file" accept="application/json,.json" hidden />
    </div>

  </aside>

  <main>
    <div class="topbar">
      <div class="search" role="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="globalSearch" type="search" placeholder="프로젝트, 컷, 단계, 용어를 검색해 보세요…" autocomplete="off" aria-label="검색" />
        <kbd>Ctrl K</kbd>
        <div id="searchResults" class="search-results" hidden></div>
      </div>
      <span class="spacer"></span>
      <button id="settingsBtn" class="ai-pill" type="button" title="AI 연결">
        <span class="ai-avatar" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M4.9 4.9l2.1 2.1m10 10 2.1 2.1M4.9 19.1 7 17m10-10 2.1-2.1"/></svg></span>
        <span id="aiLabel">AI 연결</span><span id="aiStatus" class="status-dot" aria-hidden="true"></span>
      </button>
    </div>
    <header class="page-head">
      <div class="ph-text">
        <span id="pageStep" class="page-step"></span>
        <h1 id="pageTitle">작업 현황</h1>
        <p id="pageDesc" class="page-desc"></p>
      </div>
      <div id="pageSide" class="ph-side"></div>
    </header>

    <section id="tab-home" class="panel active"><div id="homeBody"></div></section>

    <!-- 1 기획 -->
    <section id="tab-plan" class="panel">
      <div class="plan-layout">
        <form id="planForm" class="card plan-input" autocomplete="off">
          <label>주제 <input name="topic" placeholder="예: 친환경 텀블러 신제품 런칭" /></label>
          <label>목적 <input name="purpose" list="purposeList" placeholder="예: 인스타그램 광고" /></label>
          <datalist id="purposeList"></datalist>
          <label>느낌 <input name="mood" placeholder="예: 경쾌하고 미니멀, 아침 햇살" /></label>
          <div class="row">
            <label>길이(초) <input name="runtime" type="number" min="3" max="600" step="1" list="runtimeList" placeholder="30" /></label>
            <datalist id="runtimeList"></datalist>
            <label>비율 <select name="ratio"><option>16:9</option><option>9:16</option><option>1:1</option></select></label>
          </div>
          <label>메모 <input name="notes" placeholder="타깃, 꼭 넣을 것 (선택)" /></label>
          <span class="field-label">레퍼런스 <em>이미지마다 쓰임을 골라요 (🎨 스타일 · 📦 등장 대상 · 📐 구도) · 최대 9장</em></span>
          <div id="planRefs" class="ref-grid"></div>
          <button type="button" id="generatePlanBtn" class="btn primary-lg">✨ 기획안 만들기</button>
          <button type="button" class="btn ghost full" data-autopilot title="기획 → 스토리보드 → 스타일프레임 → 캐릭터 → 샷 프롬프트·이미지까지">끝까지 자동 진행</button>
        </form>

        <div id="planResult" class="card plan-result" aria-live="polite"></div>
      </div>
      <div class="stage-next" data-next="chars"></div>
    </section>

    <section id="tab-chars" class="panel"><div id="charsBody"></div><div class="stage-next" data-next="style"></div></section>
    <section id="tab-style" class="panel"><div id="styleBody"></div><div class="stage-next" data-next="board"></div></section>
    <section id="tab-board" class="panel"><div id="boardBody"></div><div class="stage-next" data-next="shots"></div></section>
    <section id="tab-shots" class="panel"><div id="shotsBody"></div><div class="stage-next" data-next="select"></div></section>

    <!-- 6 애니메틱 -->
    <section id="tab-select" class="panel">
      <div id="nle" class="nle"></div>
      <div class="stage-next" data-next="video"></div>
    </section>

    <section id="tab-video" class="panel"><div id="videoBody"></div><div class="stage-next" data-next="edit"></div></section>
    <section id="tab-edit" class="panel"><div id="editBody"></div></section>
  </main>
</div>

  <input id="mediaFile" type="file" multiple hidden />
  <dialog id="lightbox" class="lightbox" aria-label="크게 보기">
    <figure><img alt="" hidden /><video controls playsinline hidden></video><figcaption></figcaption></figure>
  </dialog>

  <dialog id="settingsDialog" class="modal settings-modal" aria-labelledby="settingsTitle">
    <form method="dialog">
      <div class="settings-top">
        <h2 id="settingsTitle">AI 연결</h2>
        <p class="hint">내 계정 · 내 키로 연결해요. 같이 쓰는 사람도 각자 자기 AI를 연결하면 돼요. <a href="시작하기.html" target="_blank" rel="noopener">처음 쓰는 분 안내</a></p>
      </div>
      <div id="settingsBody" class="settings-body"></div>
      <div class="modal-actions">
        <button value="cancel" class="btn ghost">닫기</button>
        <button type="button" id="saveKeyBtn" class="btn">저장</button>
      </div>
    </form>
  </dialog>

  <dialog id="refDialog" class="modal ref-modal" aria-labelledby="refDialogTitle">
    <form method="dialog">
      <h2 id="refDialogTitle">레퍼런스 고르기</h2>
      <div id="refDialogBody"></div>
      <div class="modal-actions"><button value="done" class="btn">완료</button></div>
    </form>
  </dialog>

  <div id="toast" class="toast" hidden></div>

  <script src="data/knowledge.js"></script>
  <script src="app.js"></script>
</body>
</html>
